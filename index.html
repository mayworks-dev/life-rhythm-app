<title>校舎1階 3Dマップ V12　高品質・操作改善版</title>
<style>
  :root{font:15px system-ui,-apple-system,sans-serif;color:#183831;background:#dce4e5;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;background:#f8faf7;padding:9px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));border-bottom:1px solid #b8c7c3}
  h1{margin:0 0 7px;font-size:19px;letter-spacing:.012em}
  nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  nav+nav{margin-top:6px}
  button,select{min-height:38px;padding:4px 11px;border-radius:7px;border:1px solid #9fb4ae;background:#fff;color:#21463d;font:inherit;font-size:13px;font-weight:650;cursor:pointer;touch-action:manipulation}
  button[aria-pressed="true"]{background:#dcebe2;border-color:#719488;color:#164439}
  button:focus-visible,select:focus-visible{outline:2px solid #407b70;outline-offset:1px}
  select{max-width:100%;padding-right:19px}
  [hidden]{display:none !important}
  main{position:relative;min-height:0;flex:1;overflow:hidden}
  #view{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab}
  #still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;background:#dce4e5}
  #gesture-hint{position:absolute;left:12px;bottom:max(12px,env(safe-area-inset-bottom));margin:0;padding:6px 10px;
    max-width:calc(100% - 24px);background:#f8faf7e8;border-radius:7px;font-size:12px;pointer-events:none}
  #view[data-mode="pictures"]~#gesture-hint,#view:not([data-frames])~#gesture-hint{display:none}
  #view:active{cursor:grabbing}
  #pins{pointer-events:none;position:absolute;inset:0}
  .pin{position:absolute;min-height:23px;padding:2px 7px;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:auto;font-size:11px;box-shadow:0 1px 5px #14272435}
  #notice{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));margin:0;padding:7px 11px;max-width:calc(100% - 24px);background:#f8faf7;border:1px solid #adc0b8;border-radius:8px;font-size:13px;color:#24433d;pointer-events:none}
  @media(max-width:700px){
    header{padding:7px 7px 6px}
    h1{font-size:16px}
    nav{gap:4px}
    nav+nav{margin-top:4px}
    button,select{min-height:35px;padding:3px 8px;font-size:12px}
  }
</style>

function buildControls(ui){
    const {panel,button,select,toggle,play,practice,has,zone,state,focus} = ui;
    const action = (label,name) => {
        if(has(name)) button(panel,label,()=>play(name));
    };
    const pair = (label,open,close=null,key=open) => {
        if(has(open)) toggle(panel,label+' 開く',label+' 閉じる',open,close,key);
    };
    const levels = [['上段','3'],['中段','2'],['下段','1']];
    const staffLabels = [['chair','椅子を引く','椅子を戻す'],['top','上段 開く','上段 閉じる'],
        ['middle','中段 開く','中段 閉じる'],['bottom','下段 開く','下段 閉じる'],
        ['lift','椅子を上げる','椅子を下げる'],['spin','椅子を回す',null],['doors','棚を開く','棚を閉じる'],
        ['liner','袋を取り外す','袋を戻す'],['Bypass_Tray','手差しトレー 開く','手差しトレー 閉じる'],
        ['ADF_Scanner_Lid','スキャナーカバー 開く','スキャナーカバー 閉じる'],['Print_Demo','印刷する',null]];
    if(/^[ABCD]$/.test(zone)){
        select(panel,'教室の操作',[
            ['doors','廊下側'],['windows','窓・カーテン'],['seats','生徒席'],['teacher','教卓・収納']
        ],state.mode||'doors',v=>state.mode=v);
        if(state.mode==='windows'){
            select(panel,'窓',[[0,'窓 1'],[1,'窓 2'],[2,'窓 3'],[3,'窓 4'],[4,'全ての窓']],
                state.window||0,v=>state.window=Number(v));
            const n=String((state.window||0)+1).padStart(2,'0');
            pair('窓',state.window===4?'ExteriorV3_All_Four_Open_RightOnly':'ExteriorV3_Window_'+n+'_Open_RightOnly');
            const key=state.window===4?'Curtains_All4_Both_Close':'Curtain_Window_'+n+'_Both_Close';
            toggle(panel,'カーテン 閉じる','カーテン 開く',key,null,key);
        }else if(state.mode==='seats'){
            const seats=Array.from({length:30},(_,i)=>[i+1,'座席 '+(i+1)]);
            select(panel,'操作する座席',seats,state.seat||1,v=>state.seat=Number(v));
            const n=String(state.seat||1).padStart(2,'0');
            action('椅子を引く・戻す','Seat_'+n+'_Chair_Pull_Return');
        }else if(state.mode==='teacher'){
            for(const [label,num] of levels) pair(label,'Teacher_Desk_Drawer_'+num+'_Open','Teacher_Desk_Drawer_'+num+'_Close');
            toggle(panel,'椅子を引く','椅子を戻す','Teacher_Pull_Chair_40cm','Teacher_Stow_Chair_40cm','teacher-chair');
            toggle(panel,'椅子を上げる','椅子を下げる','Teacher_Lift_41_to_52cm','Teacher_Lower_52_to_41cm','teacher-lift');
            action('椅子を回す','Teacher_Seat_Swivel_360');
            pair('掃除用具入れ','CleanLocker_Door_Open','CleanLocker_Door_Close');
        }else{
            pair('前の引き戸','CorridorR2_FrontDoorRearLeaf_Open');

        if(typeof Uint8Array.fromBase64==='function')return Uint8Array.fromBase64(s);

    function decodeGeometry(encoded,sources={},memo=new Map()){
        const fields=encoded.split('|');
        const zip=s=>self.pako.inflate(bytes64(s));
        const planar=zip(fields[0]),n=planar.length/44;
        const vertices=new Uint8Array(planar.length);
        for(let a=0;a<44;a++){
            const start=a*n;
            for(let i=0,output=a;i<n;i++,output+=44)vertices[output]=planar[start+i];
        }
        const delta=zip(fields[1]),count=delta.length/2,indices=new Uint16Array(count);
        let value=0;
        for(let i=0;i<count;i++){
            const code=delta[i] | delta[count+i]<<8;
            value=(value+((code>>>1)^-(code&1)))&65535;
            indices[i]=value;
        }
        const shapes=fields[2]?zip(fields[2]):new Uint8Array(0);
        if(fields[3]){
            for(const [id,va,vb,nv,ia,ib,ni,sa,sb,ns] of JSON.parse(fields[3])){
                let source=memo.get(id);
                if(!source){
                    source=decodeGeometry(sources[id]);
                    memo.set(id,source);
                    if(memo.size>2)memo.delete(memo.keys().next().value);
                }
                vertices.set(source.vertices.subarray(va,va+nv),vb);
                indices.set(source.indices.subarray(ia,ia+ni),ib);
                if(ns)shapes.set(source.shapes.subarray(sa,sa+ns),sb);
            }
        }
        return {vertices,indices,shapes};
    }

    function makeGeometryDecoder(){
        if(typeof Worker!=='function'||typeof URL.createObjectURL!=='function')return null;
        let worker=null, url=null;
        try{
            const codec=document.getElementById('decoder-code').textContent;
            url=URL.createObjectURL(new Blob([codec,'\n',bytes64.toString(),'\n',decodeGeometry.toString(),`

self.onmessage=({data})=>{
    try{
        const result=decodeGeometry(data.source,data.parents,pages);
        self.postMessage({id:data.id,result},[result.vertices.buffer,result.indices.buffer,result.shapes.buffer]);
    }catch(error){
        self.postMessage({id:data.id,error:String(error)});
    }
};`],{type:'text/javascript'}));
            worker=new Worker(url);

            if(url)URL.revokeObjectURL(url);
            return null;
        }
        let next=0, pending=null;
        function close(){
            worker.terminate();
            URL.revokeObjectURL(url);
            decoder=null;
            if(pending)settle();
        }
        function settle(result){
            const job=pending;
            pending=null;
            if(!job)return;
            clearTimeout(job.timeout);
            try{
                job.resolve(result||decodeGeometry(job.source,job.parents,localPages));
            }catch(error){

        worker.onmessage=({data})=>{
            if(data.id!==pending?.id)return;
            settle(data.result);
        };
        worker.onerror=event=>{event.preventDefault();close();};

            const id=++next;
            pending={id,source,parents,resolve,reject,timeout:setTimeout(close,7000)};
            try{worker.postMessage({id,source,parents});}
            catch{close();}

    function setMorph(part,page){

        const [start,,,number]=part.geo;
        const state=page.morphs.get(start);

        if(!state.scratch)state.scratch=new Float32Array(state.base.length);
        state.scratch.set(state.base);

    function slerp(a,b,w){

    function sample(track,time){

        if(t.length===1)b=a=0;
        const dt=t[b]-t[a]||1, f=clamp((time-t[a])/dt,0,1);
        const val=(i,l=0)=>numbers.slice((how===2?i*3+l:i)*w,(how===2?i*3+l:i)*w+w);
        if(how===1)return val(f>=1?b:a);

    function animator(now){

            poseClip(job.clip,job.start+(job.end-job.start)*t);

        if(bucket){

    function axes(width,height,cameraView=camera){

    let drawable=true,revision=0,lastShadow=-Infinity;

    function makePlan(where,detail){

        const selected=zoneId(where), full=zoneId(exactZone);
        const plan={where,detail,key:where+':'+(detail||''),geometry:new Set(),maps:new Set(),opaque:[],transparent:[]};
        for(const item of items){

        }

    function choosePlan(where,detail){

    function planZoomedRoom(){

        const {scale}=axes(w,h);
        const projected=Math.max(scale[0]*w,scale[1]*h)*.5/(camera.d||1);
        if(projected<(detailRoom?24:30))return null;
        const [x,,z]=camera.target;
        let match=null,score=Infinity;
        for(const key of zonesWithBounds){
            const [lo,hi]=data.viewBounds[key];
            const dx=Math.max(0,lo[0]-x,x-hi[0]), dz=Math.max(0,lo[2]-z,z-hi[2]);
            if(dx>6||dz>6)continue;

    function stageZoomedRoom(){

    function chooseVisibleZones(basis){

        const {eye,right,up,scale}=basis;
        const vectors=[right,up];
        const planes=[];
        for(let axis=0;axis<2;axis++){
            for(const sign of [-1,1])planes.push(vectors[axis].map((coordinate,i)=>
                coordinate*scale[axis]*sign+(camera.d?eye[i]:0)));
        }
        const visible=new Set([0]);
        for(const name of choices){
            const box=data.viewBounds[name];
            if(!box){visible.add(zoneId(name));continue;}
            const [lo,hi]=box;
            const center=lo.map((low,i)=>(low+hi[i])*.5-camera.target[i]);
            const half=lo.map((low,i)=>(hi[i]-low)*.5+.70);

            if(arr!==boundArray){vao.bindVertexArrayOES(arr);boundArray=arr;}

    function scaleForSize(w,h){

    function applyInput(){

        applyInput();
        pointers.set(id,{x,y,pan});
        if(pairIds.length<2)resetPair();
    }
    function move(id,x,y){
        const previous=pointers.get(id);
        if(!previous)return;
        pointers.set(id,{x,y,pan:previous.pan});
        if(pointers.size===1){
            if(previous.pan){
                panX+=x-previous.x;panY+=y-previous.y;
            }else{
                orbitX+=x-previous.x;orbitY+=y-previous.y;
            }
        }
        request();
    }
    function up(id){
        if(!pointers.has(id))return;
        applyInput();
        pointers.delete(id);
        if(pairIds.includes(id))resetPair();
        request();
    }
    if('PointerEvent' in window){
        canvas.addEventListener('pointerdown',e=>{
            if(e.pointerType==='mouse'&&e.button!==0&&e.button!==2)return;
            try{canvas.setPointerCapture(e.pointerId);}catch{}
            down(e.pointerId,e.clientX,e.clientY,e.pointerType==='mouse'&&(e.shiftKey||e.button===2));
        });
        canvas.addEventListener('pointermove',e=>move(e.pointerId,e.clientX,e.clientY));
        for(const name of ['pointerup','pointercancel','lostpointercapture'])
            canvas.addEventListener(name,e=>up(e.pointerId));
    }else{
        canvas.addEventListener('touchstart',e=>{
            e.preventDefault();
            for(const t of e.changedTouches)down(t.identifier,t.clientX,t.clientY,false);
        },{passive:false});
        canvas.addEventListener('touchmove',e=>{
            e.preventDefault();
            for(const t of e.changedTouches)move(t.identifier,t.clientX,t.clientY);
        },{passive:false});
        for(const name of ['touchend','touchcancel'])
            canvas.addEventListener(name,e=>{for(const t of e.changedTouches)up(t.identifier);});
    }
    for(const name of ['gesturestart','gesturechange','gestureend'])
        canvas.addEventListener(name,e=>e.preventDefault(),{passive:false});
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    canvas.addEventListener('wheel',e=>{
        e.preventDefault();
        zoomBy(Math.exp(-e.deltaY*.0014));
    },{passive:false});
    window.addEventListener('keydown',e=>{
        if((e.key!=='ArrowLeft'&&e.key!=='ArrowRight')||e.target?.tagName==='SELECT')return;
        const steps=['Campus',...choices],i=steps.indexOf(zone);
        const j=(i+(e.key==='ArrowRight'?1:-1)+steps.length)%steps.length;
        go(steps[j]==='Campus'?'all':steps[j]);
        e.preventDefault();
    });

    go(seedView()==='Campus'?'all':seedView());

    if(window.schoolCampusTest)window.schoolCampusInspect=()=>({
        camera,zone,roof,jobs,poses,weights,go,blocked,detailRoom,plan:activePlan?.key,
        geometryBytes:[...geometryCache.values()].reduce((s,e)=>s+e.bytes,0),
        textureBytes:[...textureCache.values()].reduce((s,e)=>s+e.bytes,0),
        pages:geometryCache.size,
    });
}
openCampus().catch(showPictureMenu);

</script>
