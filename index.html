<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>校舎1階 3Dマップ V11</title>
<style>
  :root{font:15px system-ui,-apple-system,sans-serif;color:#183831;background:#dce4e5;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;background:#f8faf7;padding:9px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));border-bottom:1px solid #b8c7c3}
  h1{margin:0 0 7px;font-size:19px;letter-spacing:.012em}
  nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  nav+nav{margin-top:6px}
  button,select{min-height:38px;padding:4px 11px;border-radius:7px;border:1px solid #9fb4ae;background:#fff;color:#21463d;font:inherit;font-size:13px;font-weight:650;cursor:pointer;touch-action:manipulation}
  button[aria-pressed="true"]{background:#dcebe2;border-color:#719488;color:#164439}
  button:focus-visible,select:focus-visible{outline:2px solid #407b70;outline-offset:1px}
  select{max-width:100%;padding-right:19px}
  [hidden]{display:none !important}
  main{position:relative;min-height:0;flex:1;overflow:hidden}
  #view{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab}
  #view:active{cursor:grabbing}
  #pins{pointer-events:none;position:absolute;inset:0}
  .pin{position:absolute;min-height:23px;padding:2px 7px;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:auto;font-size:11px;box-shadow:0 1px 5px #14272435}
  #notice{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));margin:0;padding:7px 11px;max-width:calc(100% - 24px);background:#f8faf7;border:1px solid #adc0b8;border-radius:8px;font-size:13px;color:#24433d;pointer-events:none}
  @media(max-width:700px){
    header{padding:7px 7px 6px}
    h1{font-size:16px}
    nav{gap:4px}
    nav+nav{margin-top:4px}
    button,select{min-height:35px;padding:3px 8px;font-size:12px}
  }
</style>
</head>
<body>
<header>
  <h1>校舎1階 3Dマップ V11</h1>
  <nav id="views" aria-label="視点"></nav>
  <nav id="controls" aria-label="部屋の操作" hidden></nav>
</header>
<main>
  <canvas id="view" aria-label="校舎1階の3Dモデル" tabindex="0"></canvas>
  <div id="pins" hidden></div>
  <p id="notice" role="status">3Dモデルを読み込み中…</p>
</main>
<script defer src="campus-data.js"></script>
<script defer src="vertices-01.js"></script>
<script defer src="indices-01.js"></script>
<script defer src="shapes-01.js"></script>
<script defer src="materials-01.js"></script>
<script defer src="materials-02.js"></script>
<script defer src="viewer.js"></script>
</body>
</html>
